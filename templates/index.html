<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Index Page</title>
    <!-- 引入 Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="jumbotron">
            <h1 class="display-4">Welcome to Our Website!</h1>
            <p class="lead">This is a more complex index page with dynamic content.</p>
            <hr class="my-4">
            <p>{{ welcome_message }}</p>
            <a class="btn btn-primary btn-lg" href="#" role="button">Learn more</a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <h2>Section 1</h2>
                <p>{{ section_1_content }}</p>
            </div>
            <div class="col-md-4">
                <h2>Section 2</h2>
                <p>{{ section_2_content }}</p>
            </div>
            <div class="col-md-4">
                <h2>Section 3</h2>
                <p>{{ section_3_content }}</p>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS 和依赖的 Popper.js 以及 jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.9.5/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
